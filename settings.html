<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="每日浏览 arXiv 量子论文的中文摘要、研究结论与创新点。">
  <title>阅读偏好 · 量子论文日报</title>
  <link rel="icon" href="assets/logo2-removebg-preview.png">
  <link rel="stylesheet" href="css/quantum-daily.css?v=20261114-application">
  <script src="js/auth-config.js"></script>
  <script src="js/auth.js"></script>
  <script>Auth.requireAuth();</script>
  <script defer src="js/data-config.js"></script>
  <script defer src="js/papers.js?v=20261114-application"></script>
  <script defer src="js/settings.js"></script>
</head>
<body>
<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">Q</span>量子论文日报</a>
    <nav aria-label="主导航">
      <a href="index.html">论文速览</a>
      <a href="statistic.html">主题统计</a>
      <a href="settings.html" aria-current="page">阅读偏好</a>
    </nav>
    <button class="text-button sign-out" type="button" id="logoutButton" hidden>退出</button>
  </div>
</header>
<main class="shell">
  <section class="hero">
    <div>
      <h1>阅读偏好</h1>
      <p>设定关注的主题、关键词和作者，匹配的论文会在列表中优先显示。</p>
    </div>
  </section>
  <form id="settings" class="panel settings-panel">
    <div class="form-field">
      <label for="keywords">主题与关键词</label>
      <textarea id="keywords" rows="4" placeholder="例如：量子纠错、surface code、逻辑量子比特"></textarea>
      <p class="muted">可以用换行、逗号或顿号分隔。</p>
    </div>
    <div class="form-field">
      <label for="authors">关注作者</label>
      <textarea id="authors" rows="4" placeholder="每行填写一位作者的姓名"></textarea>
    </div>
    <div class="form-actions">
      <button class="button primary" type="submit">保存偏好</button>
      <button class="button secondary" type="button" id="clearPreferences">清空</button>
      <span id="settingsStatus" class="muted" role="status"></span>
    </div>
  </form>
</main>
<footer class="shell site-footer"><span>量子论文日报</span><span>论文来源 <a href="https://arxiv.org/list/quant-ph/new" target="_blank" rel="noopener noreferrer">arXiv</a></span></footer>
</body>
</html>
