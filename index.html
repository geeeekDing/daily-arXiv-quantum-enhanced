<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="每日浏览 arXiv 量子论文的中文摘要、研究结论与创新点。">
  <title>论文速览 · 量子论文日报</title>
  <link rel="icon" href="assets/logo2-removebg-preview.png">
  <link rel="stylesheet" href="css/quantum-daily.css?v=20261114-calendar">
  <script src="js/auth-config.js"></script>
  <script src="js/auth.js"></script>
  <script>Auth.requireAuth();</script>
  <script defer src="js/data-config.js?v=20261114-quantum-data"></script>
  <script defer src="js/papers.js?v=20261114-calendar"></script>
  <script defer src="js/app.js?v=20261114-topics"></script>
</head>
<body>
<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">Q</span>量子论文日报</a>
    <nav aria-label="主导航">
      <a href="index.html" aria-current="page">论文速览</a>
      <a href="statistic.html">主题统计</a>
      <a href="settings.html">阅读偏好</a>
    </nav>
    <button class="text-button sign-out" type="button" id="logoutButton" hidden>退出</button>
  </div>
</header>
<main class="shell">
  <section class="hero">
    <div>
      <h1>量子论文日报</h1>
      <p>浏览 arXiv 量子研究的最新中文摘要。</p>
    </div>
    <div class="hero-data" aria-live="polite">
      <span>最新一期</span><strong id="latestDate">—</strong><small id="latestCount"></small>
    </div>
  </section>
  <div class="dashboard">
    <aside class="panel filters" aria-label="论文筛选">
      <div class="section-heading filter-heading"><h2>筛选论文</h2><button class="text-button" id="resetFilters" type="button">重置</button></div>
      <details id="filterDisclosure" class="filter-disclosure" open>
        <summary>日期与主题筛选</summary>
        <div class="date-fields" id="dateFields"></div>
        <div class="filter-block" id="categoryBlock" hidden>
          <label for="category">arXiv 分类</label>
          <select id="category"></select>
        </div>
        <div class="filter-block">
          <h3>研究主题</h3>
          <div class="topic-list" id="topics"></div>
        </div>
      </details>
    </aside>
    <section class="feed" aria-labelledby="feedTitle">
      <div class="feed-heading">
        <div><h2 id="feedTitle">论文列表</h2><p id="resultCount" aria-live="polite"></p></div>
        <label class="search-field"><span class="search-icon" aria-hidden="true"></span>
          <input id="search" type="search" aria-label="搜索论文" placeholder="搜索标题、作者或摘要">
        </label>
      </div>
      <div class="preference-bar" id="preferenceBar" hidden>
        <label><input type="checkbox" id="preferredOnly"> 仅看匹配关注的论文</label>
        <a href="settings.html">编辑关注</a>
      </div>
      <div id="feedStatus" class="status" role="status">正在加载论文…</div>
      <div id="papers" class="paper-list"></div>
      <button class="button secondary show-more" id="showMore" type="button" hidden>加载更多</button>
    </section>
  </div>
</main>

<dialog class="paper-dialog" id="paperDialog" aria-labelledby="detailTitle">
  <div class="dialog-toolbar">
    <span id="detailDate"></span>
    <button type="button" class="button secondary" id="closeDetail">关闭 <span aria-hidden="true">×</span></button>
  </div>
  <div class="dialog-content" id="paperDetails"></div>
</dialog>
<footer class="shell site-footer"><span>量子论文日报</span><span>论文来源 <a href="https://arxiv.org/list/quant-ph/new" target="_blank" rel="noopener noreferrer">arXiv</a></span></footer>
</body>
</html>
