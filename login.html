<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>访问验证 · 量子论文日报</title>
  <link rel="icon" href="assets/logo2-removebg-preview.png">
  <link rel="stylesheet" href="css/quantum-daily.css">
  <script src="js/auth-config.js"></script>
  <script src="js/auth.js"></script>
</head>
<body>
<main class="shell login-shell">
  <form id="loginForm" class="panel settings-panel">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">Q</span>量子论文日报</a>
    <div>
      <h1>访问验证</h1>
      <p class="muted">输入访问口令以继续浏览。</p>
    </div>
    <div class="form-field">
      <label for="password">访问口令</label>
      <input id="password" type="password" required autocomplete="current-password">
    </div>
    <label class="range-toggle"><input id="rememberMe" type="checkbox" checked> 记住我 7 天</label>
    <div class="form-actions">
      <button class="button primary" type="submit">继续访问</button>
      <span class="muted" id="loginStatus" role="status"></span>
    </div>
  </form>
</main>
<script>
  const requestedPage = new URLSearchParams(location.search).get('redirect');
  const destination = ['index.html', 'statistic.html', 'settings.html'].includes(requestedPage)
    ? requestedPage : 'index.html';
  if (!Auth.isPasswordEnabled() || Auth.isAuthenticated()) location.replace(destination);

  const form = document.getElementById('loginForm');
  const password = document.getElementById('password');
  const remember = document.getElementById('rememberMe');
  const status = document.getElementById('loginStatus');
  form.addEventListener('submit', async event => {
    event.preventDefault();
    status.textContent = '';
    if (await Auth.login(password.value, remember.checked)) {
      location.replace(destination);
    } else {
      status.textContent = '口令不正确，请重试。';
      password.select();
    }
  });
</script>
</body>
</html>
