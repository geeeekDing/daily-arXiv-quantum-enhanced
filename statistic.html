<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="每日浏览 arXiv 量子论文的中文摘要、研究结论与创新点。">
  <title>主题统计 · 量子论文日报</title>
  <link rel="icon" href="assets/logo2-removebg-preview.png">
  <link rel="stylesheet" href="css/quantum-daily.css?v=20261114-topics">
  <script src="js/auth-config.js"></script>
  <script src="js/auth.js"></script>
  <script>Auth.requireAuth();</script>
  <script defer src="js/data-config.js"></script>
  <script defer src="js/papers.js?v=20261114-topics"></script>
  <script defer src="js/statistic.js?v=20261114-topics"></script>
</head>
<body>
<header class="site-header">
  <div class="shell header-inner">
    <a class="brand" href="index.html"><span class="brand-mark" aria-hidden="true">Q</span>量子论文日报</a>
    <nav aria-label="主导航">
      <a href="index.html">论文速览</a>
      <a href="statistic.html" aria-current="page">主题统计</a>
      <a href="settings.html">阅读偏好</a>
    </nav>
    <button class="text-button sign-out" type="button" id="logoutButton" hidden>退出</button>
  </div>
</header>
<main class="shell">
  <section class="hero">
    <div>
      <h1>主题统计</h1>
      <p>查看所选日期内的研究分布，点击主题回到对应的论文列表。</p>
    </div>
    <div class="hero-data" aria-live="polite">
      <span>已标注 / 所选论文</span><strong id="coverage">—</strong><small>同一篇论文可归入多个主题</small>
    </div>
  </section>
  <div class="dashboard">
    <aside class="panel filters" aria-label="统计范围">
      <div class="section-heading"><h2>统计范围</h2></div>
      <div class="date-fields" id="dateFields"></div>
    </aside>
    <div class="statistics">
      <div id="statsStatus" class="status" role="status">正在加载论文…</div>
      <section class="panel chart-panel" id="rankPanel" hidden aria-labelledby="rankTitle">
        <div class="section-heading"><h2 id="rankTitle">研究主题排行</h2><span class="muted">按论文篇数</span></div>
        <ol id="ranking" class="ranking"></ol>
      </section>
      <section class="panel chart-panel" id="trendPanel" hidden aria-labelledby="trendTitle">
        <div class="section-heading"><h2 id="trendTitle">每日趋势</h2>
          <label for="trendTag">研究主题 <select id="trendTag"></select></label>
        </div>
        <div id="trendChart" class="trend-chart"></div>
      </section>
    </div>
  </div>
</main>
<footer class="shell site-footer"><span>量子论文日报</span><span>论文来源 <a href="https://arxiv.org/list/quant-ph/new" target="_blank" rel="noopener noreferrer">arXiv</a></span></footer>
</body>
</html>
