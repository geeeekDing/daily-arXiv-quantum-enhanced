name: arXiv-daily-ai-enhanced

on:
  schedule:
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arxiv-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CATEGORIES: ${{ vars.CATEGORIES || 'quant-ph' }}

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Crawl and deduplicate arXiv papers
        id: crawl
        run: |
          set -euo pipefail
          today=$(date -u +%F)
          echo "date=$today" >> "$GITHUB_OUTPUT"
          mkdir -p data
          prior="$RUNNER_TEMP/$today.jsonl"
          if git ls-remote --exit-code --heads origin refs/heads/data >/dev/null; then
            git fetch --depth=1 origin data
            if git cat-file -e "FETCH_HEAD:data/$today.jsonl" 2>/dev/null; then
              git show "FETCH_HEAD:data/$today.jsonl" > "$prior"
            fi
            existing="data/${today}_AI_enhanced_Chinese.jsonl"
            if git cat-file -e "FETCH_HEAD:$existing" 2>/dev/null; then
              git show "FETCH_HEAD:$existing" > "$existing"
            fi
            for offset in {1..7}; do
              path="data/$(date -u -d "$offset days ago" +%F).jsonl"
              if git cat-file -e "FETCH_HEAD:$path" 2>/dev/null; then
                git show "FETCH_HEAD:$path" > "$path"
              fi
            done
          else
            remote_status=$?
            if [ "$remote_status" -ne 2 ]; then
              exit "$remote_status"
            fi
          fi

          source .venv/bin/activate
          cd daily_arxiv
          scrapy crawl arxiv -O "../data/$today.jsonl"
          test -f "../data/$today.jsonl"
          status=0
          python daily_arxiv/check_stats.py || status=$?
          case "$status" in
            0)
              if [ -f "$prior" ]; then
                python - "$prior" "../data/$today.jsonl" <<'PYTHON'
          import json
          import sys
          from pathlib import Path

          prior, current = map(Path, sys.argv[1:])
          papers = {}
          for source in (prior, current):
              for line in source.read_text(encoding="utf-8").splitlines():
                  if line.strip():
                      paper = json.loads(line)
                      papers[paper["id"]] = paper
          current.write_text(
              "".join(json.dumps(row, ensure_ascii=False) + "\n" for row in papers.values()),
              encoding="utf-8",
          )
          PYTHON
              fi
              echo "has_new_content=true" >> "$GITHUB_OUTPUT"
              ;;
            1) echo "has_new_content=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac

      - name: Generate Chinese translations and Markdown
        if: steps.crawl.outputs.has_new_content == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          DATE: ${{ steps.crawl.outputs.date }}
        run: |
          if [ -z "$OPENAI_BASE_URL" ]; then unset OPENAI_BASE_URL; fi
          uv run --locked python ai/enhance.py --resume --data "data/$DATE.jsonl" --max_workers 3
          uv run --locked python to_md/convert.py --data "data/${DATE}_AI_enhanced_Chinese.jsonl"

      - name: Update website configuration
        if: steps.crawl.outputs.has_new_content == 'true'
        env:
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_EMAIL: ${{ vars.EMAIL }}
          COMMIT_NAME: ${{ vars.NAME }}
        run: |
          git config user.email "${COMMIT_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          git config user.name "${COMMIT_NAME:-github-actions[bot]}"
          if [ -n "$ACCESS_PASSWORD" ]; then
            password_hash=$(printf '%s' "$ACCESS_PASSWORD" | openssl dgst -sha256 -hex | awk '{print $2}')
          else
            password_hash=DISABLED_NO_PASSWORD_SET_IN_SECRETS
          fi
          sed -i "s/passwordHash: '[^']*'/passwordHash: '$password_hash'/" js/auth-config.js
          sed -i "s/repoOwner: '[^']*'/repoOwner: '$REPO_OWNER'/; s/repoName: '[^']*'/repoName: '$REPO_NAME'/" js/data-config.js
          git add js/auth-config.js js/data-config.js
          if ! git diff --staged --quiet; then
            git commit -m "chore: update website configuration"
            git push origin HEAD:main
          fi

      - name: Publish data archive
        if: steps.crawl.outputs.has_new_content == 'true'
        env:
          DATE: ${{ steps.crawl.outputs.date }}
        run: |
          output=$(mktemp -d)
          cp "data/$DATE.jsonl" "data/${DATE}_AI_enhanced_Chinese.jsonl" "data/$DATE.md" "$output/"
          if git ls-remote --exit-code --heads origin refs/heads/data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add --detach "$output/archive" FETCH_HEAD
          else
            remote_status=$?
            if [ "$remote_status" -ne 2 ]; then
              exit "$remote_status"
            fi
            git worktree add --detach "$output/archive" HEAD
            (
              cd "$output/archive"
              git checkout --orphan data
              git rm -rf .
              printf '# arXiv data archive\n' > README.md
            )
          fi
          cd "$output/archive"
          mkdir -p data assets
          cp "$output"/*.jsonl "$output"/*.md data/
          for path in data/*.jsonl; do printf '%s\n' "${path##*/}"; done | LC_ALL=C sort > assets/file-list.txt
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "update: $DATE arXiv papers"
            git push origin HEAD:data
          fi
