name: arXiv-daily-ai-enhanced

on:
  schedule:
    # Beijing time: 12:00 to 17:30 every half hour, then a final 18:00 check.
    - cron: "0,30 4-9 * * 1-5"
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arxiv-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CATEGORIES: ${{ vars.CATEGORIES || 'quant-ph' }}

    steps:
      - name: Check whether today's announcement is already archived
        id: poll
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          read -r today weekday hhmm < <(TZ=Asia/Shanghai date '+%F %u %H%M')
          if (( weekday > 5 || 10#$hhmm < 1200 || 10#$hhmm > 1800 )); then
            echo "::notice::本次定时运行已超出北京时间工作日 12:00–18:00 的检查时段。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=$(curl --silent --show-error --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/contents/data/${today}_AI_enhanced_Chinese.jsonl?ref=data")
          case "$code" in
            200)
              echo "::notice::$today 日报已归档，本次无需再次检查 arXiv。"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            404) echo "expected_date=$today" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::查询日报归档失败（HTTP $code）。"; exit 1 ;;
          esac

      - uses: actions/checkout@v5
        if: steps.poll.outputs.skip != 'true'
        with:
          ref: main

      - name: Install uv
        if: steps.poll.outputs.skip != 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Install dependencies
        if: steps.poll.outputs.skip != 'true'
        run: uv sync --locked

      - name: Crawl and deduplicate arXiv papers
        id: crawl
        if: steps.poll.outputs.skip != 'true'
        env:
          EXPECTED_DATE: ${{ steps.poll.outputs.expected_date }}
        run: |
          set -euo pipefail
          staging=$(mktemp -d)
          archive="$staging/archive"
          if git ls-remote --exit-code --heads origin refs/heads/data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add --detach "$archive" FETCH_HEAD
          else
            remote_status=$?
            if [ "$remote_status" -ne 2 ]; then
              exit "$remote_status"
            fi
          fi

          (
            cd daily_arxiv
            ../.venv/bin/scrapy crawl arxiv -a manifest="$staging/manifest.json" -O "$staging/papers.jsonl"
          )
          test -f "$staging/manifest.json"
          touch "$staging/papers.jsonl"
          status=0
          day=$(.venv/bin/python daily_arxiv/daily_arxiv/check_stats.py prepare \
            --manifest "$staging/manifest.json" --crawl "$staging/papers.jsonl" \
            --archive "$archive" --output data --expected-date "${EXPECTED_DATE:-}") || status=$?
          case "$status" in
            0)
              enhanced="${day}_AI_enhanced_Chinese.jsonl"
              if [ -f "$archive/data/$enhanced" ]; then
                cp "$archive/data/$enhanced" "data/$enhanced"
              fi
              printf 'date=%s\nhas_new_content=true\n' "$day" >> "$GITHUB_OUTPUT"
              ;;
            1)
              echo "has_new_content=false" >> "$GITHUB_OUTPUT"
              echo "::notice::当前 arXiv 公告没有未归档的新论文，本次跳过翻译和发布。"
              ;;
            *) exit "$status" ;;
          esac

      - name: Generate Chinese translations and Markdown
        if: steps.crawl.outputs.has_new_content == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          MODEL_NAME: ${{ vars.MODEL_NAME }}
          DATE: ${{ steps.crawl.outputs.date }}
        run: |
          if [ -z "$OPENAI_BASE_URL" ]; then unset OPENAI_BASE_URL; fi
          uv run --locked python ai/enhance.py --resume --data "data/$DATE.jsonl" --max_workers 3
          uv run --locked python to_md/convert.py --data "data/${DATE}_AI_enhanced_Chinese.jsonl"

      - name: Update website configuration
        if: steps.crawl.outputs.has_new_content == 'true'
        env:
          ACCESS_PASSWORD: ${{ secrets.ACCESS_PASSWORD }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
          COMMIT_EMAIL: ${{ vars.EMAIL }}
          COMMIT_NAME: ${{ vars.NAME }}
        run: |
          git config user.email "${COMMIT_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          git config user.name "${COMMIT_NAME:-github-actions[bot]}"
          if [ -n "$ACCESS_PASSWORD" ]; then
            password_hash=$(printf '%s' "$ACCESS_PASSWORD" | openssl dgst -sha256 -hex | awk '{print $2}')
          else
            password_hash=DISABLED_NO_PASSWORD_SET_IN_SECRETS
          fi
          sed -i "s/passwordHash: '[^']*'/passwordHash: '$password_hash'/" js/auth-config.js
          sed -i "s/repoOwner: '[^']*'/repoOwner: '$REPO_OWNER'/; s/repoName: '[^']*'/repoName: '$REPO_NAME'/" js/data-config.js
          git add js/auth-config.js js/data-config.js
          if ! git diff --staged --quiet; then
            git commit -m "chore: update website configuration"
            git push origin HEAD:main
          fi

      - name: Publish data archive
        if: steps.crawl.outputs.has_new_content == 'true'
        env:
          DATE: ${{ steps.crawl.outputs.date }}
        run: |
          output=$(mktemp -d)
          cp "data/$DATE.jsonl" "data/${DATE}_AI_enhanced_Chinese.jsonl" "data/$DATE.md" "$output/"
          if git ls-remote --exit-code --heads origin refs/heads/data >/dev/null; then
            git fetch --depth=1 origin data
            git worktree add --detach "$output/archive" FETCH_HEAD
          else
            remote_status=$?
            if [ "$remote_status" -ne 2 ]; then
              exit "$remote_status"
            fi
            git worktree add --detach "$output/archive" HEAD
            (
              cd "$output/archive"
              git checkout --orphan data
              git rm -rf .
              printf '# arXiv data archive\n' > README.md
            )
          fi
          mkdir -p "$output/archive/data"
          cp "$output"/*.jsonl "$output"/*.md "$output/archive/data/"
          python3 daily_arxiv/daily_arxiv/check_stats.py reindex "$output/archive"
          cd "$output/archive"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "update: $DATE arXiv papers"
            git push origin HEAD:data
          fi
